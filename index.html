<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chamomile</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵️</text></svg>" />
    </head>
    <body>
        <!-- Star Background Container -->
        <div id="star-background" class="star-background"></div>
        <!-- Main Board Content -->
        <div class="board">
            <div class="lanes">
                <div class="swim-lane" id="todo-lane">
                    <div class="lane-header">
                        <h3>TODO</h3>
                        <form id="todo-form">
                            <input type="text" id="todo-input" placeholder="Add a task" required />
                            <button type="submit">ADD</button>
                        </form>
                    </div>
                </div>
                <div class="swim-lane" id="doing-lane">
                    <h3>DOING</h3>
                </div>
                <div class="swim-lane" id="done-lane">
                    <h3>DONE</h3>
                </div>
            </div>
        </div>
        <script src="storage.js"></script>
        <script src="drag.js"></script>
        <script src="todo.js"></script>
        <script src="utils.js"></script>
        <script src="star-background.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                loadTasks();
                initializeStarBackground();
            });
        </script>
    </body>
</html>
